name: 🔧 OpenCode Agent

# Autonomous agent: receives a ticket, implements it, and opens a PR.
# Uses OpenCode CLI with built-in model (no API keys required).

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Target repo owner (e.g. Sellio-Squad)"
        required: true
        type: string
      repo:
        description: "Target repo name (e.g. sellio_metrics)"
        required: true
        type: string
      issue_number:
        description: "Issue number"
        required: true
        type: string
      task_id:
        description: "Unique task ID from Cloudflare KV"
        required: true
        type: string
      branch_name:
        description: "Branch to create and push to (e.g. ai/42-fix-login)"
        required: true
        type: string
      base_branch:
        description: "Default branch to clone and PR into (e.g. main)"
        required: false
        type: string
        default: "develop"
      timeout:
        description: "Timeout in minutes"
        required: false
        type: number
        default: 40

jobs:
  opencode-agent:
    name: "🔧 OpenCode Issue #${{ inputs.issue_number }} in ${{ inputs.repo }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: "📊 Log environment"
        run: |
          echo "Target Repo: ${{ inputs.owner }}/${{ inputs.repo }}"
          echo "Base Branch: ${{ inputs.base_branch }}"
          echo "Feature Branch: ${{ inputs.branch_name }}"
          echo "Issue: #${{ inputs.issue_number }}"

      # ── 1. Generate GitHub App installation token ──────────────────────
      - name: "Generate App token"
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}

      # ── 2. Checkout the TARGET repo ────────────────────────────────────
      - name: "📦 Checkout ${{ inputs.owner }}/${{ inputs.repo }}"
        uses: actions/checkout@v4
        with:
          repository: "${{ inputs.owner }}/${{ inputs.repo }}"
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      # ── 3. Fetch issue details ─────────────────────────────────────────
      - name: "📋 Fetch issue details"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/${{ inputs.issue_number }} \
            --jq '.title' > /tmp/issue_title.txt
          gh api /repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/${{ inputs.issue_number }} \
            --jq '.body'  > /tmp/issue_body.txt
          echo "📋 Issue: $(cat /tmp/issue_title.txt)"

      # ── 4. Auto-detect stack ───────────────────────────────────────────
      - name: "🔍 Detect stack"
        id: detect
        run: |
          # Find all Flutter app dirs (for monorepo)
          APPS=$(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -exec dirname {} \; | tr '\n' ' ')
          echo "Detected Flutter apps: $APPS"
          echo "apps=$APPS" >> $GITHUB_OUTPUT
          if find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" | grep -q .; then
            echo "stack=flutter" >> $GITHUB_OUTPUT
          elif find . -name "build.gradle*" | grep -q .; then
            echo "stack=kotlin" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "stack=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "stack=python" >> $GITHUB_OUTPUT
          else
            echo "stack=unknown" >> $GITHUB_OUTPUT
          fi
          echo "stack=$(cat $GITHUB_OUTPUT | grep stack= | cut -d= -f2)"

      # ── 4a. Setup Flutter ──────────────────────────────────────────────
      - name: "Setup Flutter"
        if: steps.detect.outputs.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      # ── 4b. Setup Java 17 ─────────────────────────────────────────────
      - name: "Setup Java 17"
        if: steps.detect.outputs.stack == 'kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── 4c. Setup Node 22 ─────────────────────────────────────────────
      - name: "Setup Node 22"
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ── 4d. Setup Python 3.11 ─────────────────────────────────────────
      - name: "🐍 Setup Python 3.11"
        if: steps.detect.outputs.stack == 'python' || steps.detect.outputs.stack == 'unknown'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 5. Install OpenCode ───────────────────────────────────────────
      - name: "📦 Install OpenCode"
        run: npm install -g opencode-ai@latest

      # ── 5x. Capture BEFORE Screenshots ───────────────────────────────
      - name: "📸 Capture BEFORE Screenshots"
        run: |
          mkdir -p /tmp/before_screenshots
          for APP_DIR in ${{ steps.detect.outputs.apps }}; do
            if [ -d "$APP_DIR" ]; then
              echo "── Preparing $APP_DIR ──"
              (cd "$APP_DIR" && flutter pub get) || true
              
              echo "Running codegen in $APP_DIR..."
              (cd "$APP_DIR" && dart run build_runner build --delete-conflicting-outputs) >/dev/null 2>&1 || true
              
              echo "🔍 Capturing BEFORE state for $APP_DIR"
              if [ "${{ steps.detect.outputs.stack }}" == "flutter" ]; then
                (cd "$APP_DIR" && flutter test --update-goldens || true)
                # Save goldens with relative paths to /tmp/before_screenshots
                find "$APP_DIR" -name "*.png" -path "*/goldens/*" | while read f; do
                  dest="/tmp/before_screenshots/${f#./}"
                  mkdir -p "$(dirname "$dest")"
                  cp "$f" "$dest"
                done
                # Also check for any manually saved screenshots in the app root
                if [ -d "$APP_DIR/screenshots" ]; then
                  find "$APP_DIR/screenshots" -name "*.png" | while read f; do
                    dest="/tmp/before_screenshots/${f#./}"
                    mkdir -p "$(dirname "$dest")"
                    cp "$f" "$dest"
                  done
                fi
              fi
            fi
          done

      # ── 6. Configure git ──────────────────────────────────────────────
      - name: "Configure git"
        run: |
          git config user.email "sellio-bot@sellio.app"
          git config user.name "Sellio Bot"
          git checkout -b "${{ inputs.branch_name }}"

      # ── 7. Run OpenCode ───────────────────────────────────────────────
      - name: "🤖 Run OpenCode Agent"
        id: agent
        env:
          CI: "true"
          TASK_ID: ${{ inputs.task_id }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          SELLIO_WORKER_URL: ${{ secrets.SELLIO_WORKER_URL }}
          SELLIO_WEBHOOK_SECRET: ${{ secrets.SELLIO_WEBHOOK_SECRET }}
        run: |
          ISSUE_TITLE=$(cat /tmp/issue_title.txt)
          ISSUE_BODY=$(cat /tmp/issue_body.txt)
          # Detect all Flutter app dirs for the prompt context
          APP_DIRS=$(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -exec dirname {} \; | tr '\n' ' ')

          TASK="You are a senior autonomous engineer for Sellio Metrics — Issue #${{ inputs.issue_number }}.

          Title: ${ISSUE_TITLE}

          Requirements:
          ${ISSUE_BODY}

          Context:
          - Repo app dirs with pubspec.yaml: ${APP_DIRS:-unknown (discover via find . -name pubspec.yaml)}
          - Detected stack: flutter if pubspec.yaml exists

          Mission: Take full ownership and lead until everything is fixed and green. You are NOT limited — act as the tech lead.

          UI Verification & Screenshots:
          - If you modify or create any UI components (screens, widgets, views), you MUST ensure there is a visual way to verify them.
          - Use mock data or real integrations to show the UI in its "ready" state.
          - If the project has a screenshot tool or golden tests, run them to capture the updates.
          - If no screenshot tool exists, you MUST create a temporary test (e.g., "test/visual_verification_test.dart") that renders the modified component with mock data and saves the resulting image to a "screenshots/" directory at the root of the app.
          - These screenshots are CRITICAL for the PR review. Show the user exactly what you built.

          Autonomy guidelines:
          - Explore the repo structure yourself (find pubspec.yaml, list lib/, check analysis_options.yaml, l10n.yaml, etc.).
          - For Flutter apps, ALWAYS operate in the correct app directory (e.g. frontend/ if that's where pubspec.yaml lives):
            * flutter pub get
            * dart run build_runner build --delete-conflicting-outputs  (use dart, NOT flutter pub run; fallback to dart run build_runner build if flag removed)
            * flutter gen-l10n  (or rely on flutter: generate: true; verify pubspec.yaml has flutter.generate: true)
            * flutter analyze --no-pub  and iterate until ZERO new errors in your changes
            * flutter test if tests exist
          - If you discover ANY broken build — missing build_runner output, outdated hux / dependencies, l10n generation failure, 10k+ analyze issues cascade, missing DI registration, or any pipeline error — FIX IT. Don't narrow yourself to just the ticket; make the build green.
          - Keep iterating: run analyze, fix, re-run codegen, re-analyze until clean. Do not stop after first attempt.
          - Use only real APIs you have verified by reading files; but you are free to refactor, upgrade, and fix related code as needed to unblock the pipeline.
          - Clean up unused imports when done."

          OC_STREAM=/tmp/opencode_stream.log
          touch "$OC_STREAM"

          # Run opencode in the background
          opencode run \
            --auto \
            --dir . \
            "$TASK" > "$OC_STREAM" 2>&1 &
          OC_PID=$!

          if [ -n "$SELLIO_WORKER_URL" ]; then
            echo "📡 Streaming agent output live to: $SELLIO_WORKER_URL/api/ai-pipeline/stream"
          else
            echo "⚠️  SELLIO_WORKER_URL secret is not set — streaming to dashboard disabled."
          fi

          # Stream to dashboard and local console
          tail -n +1 -F "$OC_STREAM" --pid=$OC_PID | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "🤖 $line"
            if [ -n "$SELLIO_WORKER_URL" ]; then
              # Send line to dashboard asynchronously
              (curl -s -o /dev/null -m 2 -X POST \
                "$SELLIO_WORKER_URL/api/ai-pipeline/stream" \
                -H "Content-Type: application/json" \
                -H "X-Sellio-Signature: $SELLIO_WEBHOOK_SECRET" \
                -d "$(jq -nc --arg t "$TASK_ID" --arg i "$ISSUE_NUM" --arg l "$line" \
                  '{taskId:$t, issueNumber:$i, line:$l}')" || true) &
            fi
          done

          wait $OC_PID
          OC_EXIT=$?
          echo "opencode exit code: $OC_EXIT"

          # IMPORTANT: Do NOT fail the job on opencode's exit code.
          # In this CI environment the agent cannot run codegen (build_runner /
          # gen-l10n aren't runnable per-package), so `flutter analyze` always
          # reports pre-existing generated-code errors and the agent may exit 1.
          # The "Final verification" step is the real, tolerant gate — it only
          # fails on genuine new errors the agent introduced. Always continue.
          exit 0

      # ── 8. Final verification ─────────────────────────────────────────
      - name: "✅ Final verification — Flutter"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'flutter'
        run: |
          set -e
          BASE=origin/${{ inputs.base_branch }}
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE=HEAD

          while IFS= read -r APP_DIR; do
            [ -z "$APP_DIR" ] && continue
            echo "── Verifying: $APP_DIR ──"
            # Ensure pubspec.yaml has flutter.generate flag for l10n (auto-fix if missing)
            if ! grep -q "generate: true" "$APP_DIR/pubspec.yaml"; then
              echo "⚠️ flutter.generate flag missing in $APP_DIR/pubspec.yaml — l10n will fallback to l10n.yaml"
            fi
            (cd "$APP_DIR" && flutter pub get) || exit 1

            # Robust codegen: prefer dart run (current), fallback for older flag
            echo "Running codegen in $APP_DIR..."
            (cd "$APP_DIR" && dart run build_runner build --delete-conflicting-outputs) >/dev/null 2>&1 || \
            (cd "$APP_DIR" && dart run build_runner build) >/dev/null 2>&1 || \
            echo "⚠️ build_runner skipped/failed — continuing (no builders or env issue)"

            # l10n generation — best effort, verify file exists after
            (cd "$APP_DIR" && flutter gen-l10n) >/dev/null 2>&1 || echo "⚠️ flutter gen-l10n skipped (using generate:true auto or no l10n.yaml)"
            if [ ! -f "$APP_DIR/lib/l10n/app_localizations.dart" ]; then
              echo "⚠️ app_localizations.dart still missing after gen-l10n, will still attempt analyze"
            fi

            # Debug: show analyze counts before diffing
            TOTAL_ISSUES=$(cd "$APP_DIR" && flutter analyze --no-pub 2>&1 | grep -c " issues found" || true)
            echo "Total analyze issues (including infos) before filtering: $TOTAL_ISSUES"

            # Agent's changed Dart files in this app (relative to app dir), excluding generated.
            mapfile -t CHANGED < <(git status --porcelain -- '*.dart' \
              | awk '{print $2}' | grep -vE '\.(freezed|g)\.dart$' || true)
            APP_CHANGED=()
            for f in "${CHANGED[@]:-}"; do
              [[ "$f" == "$APP_DIR/"* ]] && APP_CHANGED+=("${f#"$APP_DIR/"}")
            done
            [ ${#APP_CHANGED[@]} -eq 0 ] && { echo "No changed Dart files in $APP_DIR — skipping."; continue; }

            # JSON array of changed relpaths for jq filtering.
            RELJSON=$(printf '%s\n' "${APP_CHANGED[@]}" | jq -R . | jq -cs .)

            # Errors in changed files at HEAD (agent's version).
            HEAD_ERRS=$(cd "$APP_DIR" && flutter analyze --no-fatal-warnings --machine . 2>/dev/null \
              | grep -E '^\{' \
              | jq -c --argjson files "$RELJSON" \
                'select(.severity=="ERROR" and (.location.path as $p | $files | any($f | $p | endswith($f))))' 2>/dev/null) || true

            # Errors in changed files at BASE: stash the agent's changes, analyze, then restore.
            BASE_ERRS=""
            git stash push -u -m "ai-verify-base" -- "$APP_DIR" >/dev/null 2>&1 || true
            if git stash list | grep -q "ai-verify-base"; then
              BASE_ERRS=$(cd "$APP_DIR" && flutter analyze --no-fatal-warnings --machine . 2>/dev/null \
                | grep -E '^\{' \
                | jq -c --argjson files "$RELJSON" \
                  'select(.severity=="ERROR" and (.location.path as $p | $files | any($f | $p | endswith($f))))' 2>/dev/null) || true
              git stash pop >/dev/null 2>&1 || git stash drop >/dev/null 2/dev/null || true
            else
              BASE_ERRS="$HEAD_ERRS"   # couldn't compute base; assume nothing new
            fi

            FAIL=0
            while IFS= read -r err; do
              [ -z "$err" ] && continue
              path=$(printf '%s' "$err" | jq -r '.location.path')
              line=$(printf '%s' "$err" | jq -r '.location.startLine')
              code=$(printf '%s' "$err" | jq -r '.code // ""')
              msg=$(printf '%s' "$err" | jq -r '.message')

              # Resolve which changed relpath this error belongs to.
              rel=""
              for cf in "${APP_CHANGED[@]}"; do
                if [ "${path%"$cf"}" != "$path" ]; then rel="$cf"; break; fi
              done
              is_new=0
              if [ -n "$rel" ]; then
                git cat-file -e "$BASE:$APP_DIR/$rel" >/dev/null 2>&1 || is_new=1
              fi

              # Skip if the same error already exists on BASE (pre-existing / environmental).
              matched=$(printf '%s' "$BASE_ERRS" | jq -c \
                --arg p "$path" --arg l "$line" --arg c "$code" --arg m "$msg" \
                'select(.location.path==$p and (.location.startLine|tostring)==$l and (.code//"")==$c and .message==$m)' 2>/dev/null)

              if [ -z "$matched" ]; then
                if [ "$is_new" -eq 1 ]; then
                  # Brand-new file: only fail on unambiguous logic errors (environmental
                  # errors like unresolved packages are extremely common here and not the agent's fault).
                  if printf '%s' "$code" | grep -qE '^(invalid_assignment|argument_type_not_assignable|not_enough_positional_arguments|too_many_positional_arguments|missing_return|return_of_invalid_type|the_name_.+_is_already_defined|expected_a_value_of_type|invalid_override|missing_override|const_initialized_with_non_constant_value|list_element_type_not_assignable|map_entry_not_in_map|non_constant_list_element|wrong_number_of_type_arguments|undefined_prefixed_name|extraneous_modifier)$'; then
                    echo "❌ NEW error in $path:$line [$code] -> $msg"
                    FAIL=1
                  fi
                else
                  echo "❌ NEW error in $path:$line [$code] -> $msg"
                  FAIL=1
                fi
              fi
            done <<< "$HEAD_ERRS"

            if [ "$FAIL" -eq 1 ]; then
              echo "::error::Agent introduced NEW analyze errors in changed files (pre-existing errors ignored)."
              exit 1
            fi
            echo "✅ No NEW errors introduced by the agent in $APP_DIR."

            (cd "$APP_DIR" && flutter test --no-pub) || true
          done < <(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -exec dirname {} \;)

      - name: "✅ Final verification — Kotlin"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'kotlin'
        run: ./gradlew compileKotlin test

      - name: "✅ Final verification — Node"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'node'
        run: npm run build && npm test

      - name: "✅ Final verification — Python"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'python'
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pytest 2>/dev/null || true

      # ── 8d. Generate UI Screenshots ──────────────────────────────────
      - name: "📸 Capture AFTER Screenshots"
        if: success()
        run: |
          mkdir -p /tmp/after_screenshots
          for APP_DIR in ${{ steps.detect.outputs.apps }}; do
            if [ -d "$APP_DIR" ]; then
              echo "── Preparing $APP_DIR ──"
              (cd "$APP_DIR" && flutter pub get) || true
              (cd "$APP_DIR" && dart run build_runner build --delete-conflicting-outputs) >/dev/null 2>&1 || true
              
              echo "🔍 Capturing AFTER state for $APP_DIR"
              if [ "${{ steps.detect.outputs.stack }}" == "flutter" ]; then
                (cd "$APP_DIR" && flutter test --update-goldens || true)
                find "$APP_DIR" -name "*.png" -path "*/goldens/*" | while read f; do
                  dest="/tmp/after_screenshots/${f#./}"
                  mkdir -p "$(dirname "$dest")"
                  cp "$f" "$dest"
                done
                # Also check for any manually saved screenshots by the agent
                if [ -d "$APP_DIR/screenshots" ]; then
                  find "$APP_DIR/screenshots" -name "*.png" | while read f; do
                    dest="/tmp/after_screenshots/${f#./}"
                    mkdir -p "$(dirname "$dest")"
                    cp "$f" "$dest"
                  done
                fi
              fi
            fi
          done

      # ── 8e. 🏗️ Prepare Visual Diff ────────────────────────────────────
      - name: "🏗️ Prepare Visual Diff"
        if: success()
        run: |
          # The repo now contains the 'after' state. We want to place 'before' alongside.
          # We'll create a dedicated visual diff folder in the root of the repo.
          mkdir -p .ai/visual_diff
          
          # Find all 'after' screenshots
          find /tmp/after_screenshots -name "*.png" | while read after_path; do
            rel_path=${after_path#/tmp/after_screenshots/}
            filename=$(basename "$after_path")
            safe_name=$(echo "$rel_path" | tr '/' '_')
            
            before_path="/tmp/before_screenshots/$rel_path"
            
            if [ -f "$before_path" ]; then
              cp "$before_path" ".ai/visual_diff/before_$safe_name"
              cp "$after_path" ".ai/visual_diff/after_$safe_name"
            else
              cp "$after_path" ".ai/visual_diff/new_$safe_name"
            fi
          done

      # ── 9. Push branch ────────────────────────────────────────────────
      - name: "🚀 Push branch"
        id: push
        if: success()
        run: |
          # Stage all changes including newly generated screenshots
          git add -A
          
          if git diff --quiet && git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced by the agent — skipping push/PR."
            exit 0
          fi
          
          git diff --staged --stat
          git commit -m "feat(ai): implement #${{ inputs.issue_number }} [opencode-agent]"
          git push origin "${{ inputs.branch_name }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # ── 10. Create PR ─────────────────────────────────────────────────
      - name: "🔀 Create Pull Request"
        if: success() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_TITLE="feat(ai): implement #${{ inputs.issue_number }}"
          PR_BODY="## 🤖 AI-Generated PR

          **Issue:** #${{ inputs.issue_number }}
          **Agent:** OpenCode

          ### 🏗️ Changes Overview
          This implementation was generated autonomously. Review changes and verified UI updates below.

          ### 📸 UI Verification
          "

          HAS_SCREENSHOTS=false
          
          if [ -d ".ai/visual_diff" ]; then
            PR_BODY="$PR_BODY\n\n#### ✨ New & Updated Screens\n"
            PR_BODY="$PR_BODY\n| Screen | Before | After |\n| :--- | :---: | :---: |"
            
            # 1. Process Updates (Before and After)
            for f in $(find .ai/visual_diff -name "after_*.png" | sort); do
              filename=$(basename "$f")
              safe_name=${filename#after_}
              before_file=".ai/visual_diff/before_$safe_name"
              
              if [ -f "$before_file" ]; then
                BEFORE_URL="https://github.com/${{ inputs.owner }}/${{ inputs.repo }}/raw/${{ inputs.branch_name }}/.ai/visual_diff/before_$safe_name"
                AFTER_URL="https://github.com/${{ inputs.owner }}/${{ inputs.repo }}/raw/${{ inputs.branch_name }}/.ai/visual_diff/after_$safe_name"
                
                label=$(echo "$safe_name" | sed 's/_/ /g' | sed 's/\.png$//')
                PR_BODY="$PR_BODY\n| **$label** | ![]($BEFORE_URL) | ![]($AFTER_URL) |"
                HAS_SCREENSHOTS=true
              fi
            done
            
            # 2. Process New Screens (After only)
            for f in $(find .ai/visual_diff -name "new_*.png" | sort); do
              filename=$(basename "$f")
              safe_name=${filename#new_}
              NEW_URL="https://github.com/${{ inputs.owner }}/${{ inputs.repo }}/raw/${{ inputs.branch_name }}/.ai/visual_diff/$filename"
              
              label=$(echo "$safe_name" | sed 's/_/ /g' | sed 's/\.png$//')
              PR_BODY="$PR_BODY\n| **$label** | *(New Screen)* | ![]($NEW_URL) |"
              HAS_SCREENSHOTS=true
            done
          fi

          if [ "$HAS_SCREENSHOTS" = false ]; then
            PR_BODY="$PR_BODY\n\n*No visual changes were captured during the implementation.*"
          fi

          # Use a temporary file for the PR body to avoid shell escaping issues
          echo -e "$PR_BODY" > pr_body.txt

          gh pr create \
            --base "${{ inputs.base_branch }}" \
            --head "${{ inputs.branch_name }}" \
            --title "$PR_TITLE" \
            --body-file pr_body.txt

      # ── 11. Notify Cloudflare — SUCCESS ───────────────────────────────
      - name: "Notify Cloudflare (success)"
        if: success()
        run: |
          if [ -z "${{ secrets.SELLIO_WORKER_URL }}" ]; then exit 0; fi
          PAYLOAD=$(jq -n \
            --arg taskId "${{ inputs.task_id }}" \
            --arg branch "${{ inputs.branch_name }}" \
            --arg status "success" \
            --arg owner  "${{ inputs.owner }}" \
            --arg repo   "${{ inputs.repo }}" \
            --argjson issueNum "${{ inputs.issue_number }}" \
            '{taskId:$taskId, branch:$branch, status:$status, owner:$owner, repo:$repo, issueNumber:$issueNum}')
          curl -s -o /dev/null -w "%{http_code}" --retry 3 -X POST \
            "${{ secrets.SELLIO_WORKER_URL }}/api/ai-pipeline/result" \
            -H "Content-Type: application/json" \
            -H "X-Sellio-Signature: ${{ secrets.SELLIO_WEBHOOK_SECRET }}" \
            -d "$PAYLOAD"

      # ── 12. Notify Cloudflare — FAILURE ───────────────────────────────
      - name: "Notify Cloudflare (failure)"
        if: failure()
        run: |
          if [ -z "${{ secrets.SELLIO_WORKER_URL }}" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg taskId "${{ inputs.task_id }}" \
            --arg branch "${{ inputs.branch_name }}" \
            --arg status "failed" \
            --arg owner  "${{ inputs.owner }}" \
            --arg repo   "${{ inputs.repo }}" \
            --argjson issueNum "${{ inputs.issue_number }}" \
            --arg error  "OpenCode failed. Logs: $RUN_URL" \
            '{taskId:$taskId, branch:$branch, status:$status, owner:$owner, repo:$repo, issueNumber:$issueNum, error:$error}')
          curl -s -o /dev/null -w "%{http_code}" --retry 3 -X POST \
            "${{ secrets.SELLIO_WORKER_URL }}/api/ai-pipeline/result" \
            -H "Content-Type: application/json" \
            -H "X-Sellio-Signature: ${{ secrets.SELLIO_WEBHOOK_SECRET }}" \
            -d "$PAYLOAD"
