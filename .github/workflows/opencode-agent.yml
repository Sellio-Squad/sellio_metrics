name: 🔧 OpenCode Agent

# Autonomous agent: receives a ticket, implements it, and opens a PR.
# Uses OpenCode CLI with built-in model (no API keys required).

on:
  workflow_dispatch:
    inputs:
      owner:
        description: "Target repo owner (e.g. Sellio-Squad)"
        required: true
        type: string
      repo:
        description: "Target repo name (e.g. sellio_metrics)"
        required: true
        type: string
      issue_number:
        description: "Issue number"
        required: true
        type: string
      task_id:
        description: "Unique task ID from Cloudflare KV"
        required: true
        type: string
      branch_name:
        description: "Branch to create and push to (e.g. ai/42-fix-login)"
        required: true
        type: string
      timeout:
        description: "Timeout in minutes"
        required: false
        type: number
        default: 40

jobs:
  opencode-agent:
    name: "🔧 OpenCode Issue #${{ inputs.issue_number }} in ${{ inputs.repo }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write

    steps:
      # ── 1. Generate GitHub App installation token ──────────────────────
      - name: "Generate App token"
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}

      # ── 2. Checkout the TARGET repo ────────────────────────────────────
      - name: "📦 Checkout ${{ inputs.owner }}/${{ inputs.repo }}"
        uses: actions/checkout@v4
        with:
          repository: "${{ inputs.owner }}/${{ inputs.repo }}"
          token: ${{ steps.app-token.outputs.token }}
          ref: develop
          fetch-depth: 0

      # ── 3. Fetch issue details ─────────────────────────────────────────
      - name: "📋 Fetch issue details"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api /repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/${{ inputs.issue_number }} \
            --jq '.title' > /tmp/issue_title.txt
          gh api /repos/${{ inputs.owner }}/${{ inputs.repo }}/issues/${{ inputs.issue_number }} \
            --jq '.body'  > /tmp/issue_body.txt
          echo "📋 Issue: $(cat /tmp/issue_title.txt)"

      # ── 4. Auto-detect stack ───────────────────────────────────────────
      - name: "🔍 Detect stack"
        id: detect
        run: |
          if find . -name "pubspec.yaml" -not -path "*/build/*" | grep -q .; then
            echo "stack=flutter" >> $GITHUB_OUTPUT
          elif find . -name "build.gradle*" | grep -q .; then
            echo "stack=kotlin" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "stack=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "stack=python" >> $GITHUB_OUTPUT
          else
            echo "stack=unknown" >> $GITHUB_OUTPUT
          fi

      # ── 4a. Setup Flutter ──────────────────────────────────────────────
      - name: "Setup Flutter"
        if: steps.detect.outputs.stack == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"
          cache: true

      # ── 4b. Setup Java 17 ─────────────────────────────────────────────
      - name: "Setup Java 17"
        if: steps.detect.outputs.stack == 'kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # ── 4c. Setup Node 22 ─────────────────────────────────────────────
      - name: "Setup Node 22"
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ── 4d. Setup Python 3.11 ─────────────────────────────────────────
      - name: "🐍 Setup Python 3.11"
        if: steps.detect.outputs.stack == 'python' || steps.detect.outputs.stack == 'unknown'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 5. Install OpenCode ───────────────────────────────────────────
      - name: "📦 Install OpenCode"
        run: npm install -g opencode-ai@latest

      # ── 6. Configure git ──────────────────────────────────────────────
      - name: "Configure git"
        run: |
          git config user.email "sellio-bot@sellio.app"
          git config user.name "Sellio Bot"
          git checkout -b "${{ inputs.branch_name }}"

      # ── 7. Run OpenCode ───────────────────────────────────────────────
      - name: "🤖 Run OpenCode Agent"
        id: agent
        env:
          CI: "true"
          TASK_ID: ${{ inputs.task_id }}
          ISSUE_NUM: ${{ inputs.issue_number }}
          SELLIO_WORKER_URL: ${{ secrets.SELLIO_WORKER_URL }}
          SELLIO_WEBHOOK_SECRET: ${{ secrets.SELLIO_WEBHOOK_SECRET }}
        run: |
          ISSUE_TITLE=$(cat /tmp/issue_title.txt)
          ISSUE_BODY=$(cat /tmp/issue_body.txt)

          TASK="You are implementing GitHub Issue #${{ inputs.issue_number }}.

          Issue: ${ISSUE_TITLE}

          Requirements:
          ${ISSUE_BODY}

          MANDATORY WORKFLOW:

          1. EXPLORE the project structure to understand where code lives.
          2. RESEARCH before writing code — grep for classes/methods, read files, use only verified APIs.
          3. IMPLEMENT the changes using only real code you have read.
          4. VERIFY (Flutter repos):
             a. Run `flutter pub get`.
             b. Generate code: `flutter pub run build_runner build --delete-conflicting-outputs` and `flutter gen-l10n`.
             c. Run `flutter analyze` on ONLY the files you changed/created and ensure ZERO errors.
                Pre-existing repo errors are NOT an excuse — make YOUR changed files analyze cleanly.
             d. If you create a BLoC/cubit/provider/bloc, register it in the DI container
                (injectable module, MultiBlocProvider, or the app's DI file) — otherwise the build/runtime fails.
          5. CLEANUP — remove any unused imports you introduced.

          CRITICAL RULES:
          - NEVER invent class names, import paths, or method signatures.
          - NEVER write an import without verifying the file exists.
          - If you touch a file that already has pre-existing errors, you are NOT required to fix them,
            but you MUST NOT introduce new errors in it.
          - Focus ONLY on this issue. Do NOT fix unrelated bugs."

          OC_STREAM=/tmp/opencode_stream.log
          # Run opencode in the background, writing its (human-readable) output
          # to a file. We tail that file for both the live Actions UI log and
          # the live dashboard stream (version-agnostic: no JSON parsing needed).
          opencode run \
            --auto \
            --dir . \
            "$TASK" > "$OC_STREAM" 2>&1 &
          OC_PID=$!

          if [ -n "$SELLIO_WORKER_URL" ]; then
            echo "📡 Streaming agent output live to: $SELLIO_WORKER_URL/api/ai-pipeline/stream"
          else
            echo "⚠️  SELLIO_WORKER_URL secret is not set — streaming to dashboard disabled (live log still shown below)."
          fi

          tail -n +1 -F "$OC_STREAM" | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "🤖 $line"
            if [ -n "$SELLIO_WORKER_URL" ]; then
              curl -s -o /dev/null -w "[stream -> %{http_code}]" --max-time 5 -X POST \
                "$SELLIO_WORKER_URL/api/ai-pipeline/stream" \
                -H "Content-Type: application/json" \
                -H "X-Sellio-Signature: $SELLIO_WEBHOOK_SECRET" \
                -d "$(jq -nc --arg t "$TASK_ID" --arg i "$ISSUE_NUM" --arg l "$line" \
                  '{taskId:$t, issueNumber:$i, line:$l}')" &
            fi
          done &
          STREAM_PID=$!

          wait $OC_PID
          OC_EXIT=$?
          kill "$STREAM_PID" 2>/dev/null
          pkill -f "tail -n +1 -F $OC_STREAM" 2>/dev/null
          echo "opencode exit code: $OC_EXIT"

          # IMPORTANT: Do NOT fail the job on opencode's exit code.
          # In this CI environment the agent cannot run codegen (build_runner /
          # gen-l10n aren't runnable per-package), so `flutter analyze` always
          # reports pre-existing generated-code errors and the agent may exit 1.
          # The "Final verification" step is the real, tolerant gate — it only
          # fails on genuine new errors the agent introduced. Always continue.
          exit 0

      # ── 8. Final verification ─────────────────────────────────────────
      - name: "✅ Final verification — Flutter"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'flutter'
        run: |
          set -eu
          BASE=origin/develop
          git rev-parse --verify "$BASE" >/dev/null 2>&1 || BASE=HEAD

          while IFS= read -r APP_DIR; do
            [ -z "$APP_DIR" ] && continue
            echo "── Verifying: $APP_DIR ──"
            (cd "$APP_DIR" && flutter pub get) || exit 1
            # Generate code (freezed, json_serializable, l10n) so analyze reports
            # real errors instead of missing-generated-file cascades.
                # Best-effort code generation. In many monorepos build_runner /
                # gen-l10n aren't directly runnable per-package (missing dev deps
                # or no `flutter: generate: true` flag), so we never fail on this.
                (cd "$APP_DIR" && flutter pub run build_runner build --delete-conflicting-outputs) >/dev/null 2>&1 || true
                (cd "$APP_DIR" && flutter gen-l10n) >/dev/null 2>&1 || true

            # Analyze the whole package once (machine-readable JSON).
            ANALYSIS=$(cd "$APP_DIR" && flutter analyze --no-fatal-warnings --machine . || true)

            APP_PREFIX="$APP_DIR/"
            rm -f /tmp/verify_failed

            # For each Dart file the agent changed/created (exclude generated).
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [[ "$f" == "$APP_PREFIX"* ]] || continue
              REL="${f#"$APP_PREFIX"}"

              # Added line ranges for this file vs BASE (empty if unchanged there).
              if git cat-file -e "$BASE:$f" 2>/dev/null; then
                ADDED=$(git diff -U0 "$BASE" -- "$f" \
                  | grep -E '^@@' \
                  | sed -E 's/@@ -[0-9]+(,[0-9]+)? \+([0-9]+)(,([0-9]+))? @@.*/\2 \4/')
              else
                ADDED="ALL"   # newly created file: every line is the agent's
              fi

                  echo "$ANALYSIS" \
                    | grep -E '^\{' \
                    | jq -c --arg rel "$REL" '
                        select(
                          .severity == "ERROR"
                          and (.location.path | endswith($rel))
                          and ((.code // "") | IN(
                            "uri_has_not_been_generated","uri_does_not_exist",
                            "undefined_class","undefined_getter","undefined_method",
                            "undefined_function","undefined_identifier","undefined_operator",
                            "non_type_as_type_argument","invalid_annotation_target",
                            "annotation_with_non_class","part_of_non_part","part_of_different_library",
                            "const_constructor_with_field_initialized_by_non_constant",
                            "missing_override_of_hash_and_equal","could_not_resolve",
                            "not_a_constant_expression","must_be_immutable","final_not_initialized",
                            "non_constant_case_expression","const_initialized_with_non_constant_value"
                          ) | not)
                        )
                      ' 2>/dev/null \
                | while IFS= read -r err; do
                    line=$(printf '%s' "$err" | jq -r '.location.startLine' 2>/dev/null || echo 0)
                    msg=$(printf '%s' "$err" | jq -r '.message' 2>/dev/null || echo '')
                    if [ "$ADDED" = "ALL" ]; then
                      echo "❌ NEW error in $f:$line -> $msg"
                      touch /tmp/verify_failed
                    else
                      hit=0
                      while IFS= read -r rng; do
                        [ -z "$rng" ] && continue
                        start=${rng%% *}
                        len=${rng##* }
                        [ -z "$len" ] && len=1
                        if [ "$line" -ge "$start" ] && [ "$line" -le $((start + len)) ]; then hit=1; fi
                      done <<< "$ADDED"
                      if [ "$hit" -eq 1 ]; then
                        echo "❌ NEW error in $f:$line -> $msg"
                        touch /tmp/verify_failed
                      fi
                    fi
                  done || true
            done < <(git status --porcelain -- '*.dart' | awk '{print $2}' | grep -vE '\.(freezed|g)\.dart$' || true)

            if [ -f /tmp/verify_failed ]; then
              echo "::error::Agent introduced NEW analyze errors in changed files (pre-existing errors ignored)."
              exit 1
            fi
            echo "✅ No NEW errors introduced by the agent in $APP_DIR."

            (cd "$APP_DIR" && flutter test --no-pub) || true
          done < <(find . -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" -exec dirname {} \;)

      - name: "✅ Final verification — Kotlin"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'kotlin'
        run: ./gradlew compileKotlin test

      - name: "✅ Final verification — Node"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'node'
        run: npm run build && npm test

      - name: "✅ Final verification — Python"
        if: steps.agent.outcome == 'success' && steps.detect.outputs.stack == 'python'
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pytest 2>/dev/null || true

      # ── 9. Push branch ────────────────────────────────────────────────
      - name: "🚀 Push branch"
        id: push
        if: success()
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No changes produced by the agent — skipping push/PR."
            exit 0
          fi
          git add -A
          git diff --staged --stat
          git commit -m "feat(ai): implement #${{ inputs.issue_number }} [opencode-agent]"
          git push origin "${{ inputs.branch_name }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # ── 10. Create PR ─────────────────────────────────────────────────
      - name: "🔀 Create Pull Request"
        if: success() && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ inputs.branch_name }}" \
            --title "feat(ai): implement #${{ inputs.issue_number }}" \
            --body "## 🤖 AI-Generated PR

          **Issue:** #${{ inputs.issue_number }}
          **Agent:** OpenCode (built-in model)

          Auto-generated by the OpenCode AI agent. Review changes before merging."

      # ── 11. Notify Cloudflare — SUCCESS ───────────────────────────────
      - name: "Notify Cloudflare (success)"
        if: success()
        run: |
          if [ -z "${{ secrets.SELLIO_WORKER_URL }}" ]; then exit 0; fi
          PAYLOAD=$(jq -n \
            --arg taskId "${{ inputs.task_id }}" \
            --arg branch "${{ inputs.branch_name }}" \
            --arg status "success" \
            --arg owner  "${{ inputs.owner }}" \
            --arg repo   "${{ inputs.repo }}" \
            --argjson issueNum "${{ inputs.issue_number }}" \
            '{taskId:$taskId, branch:$branch, status:$status, owner:$owner, repo:$repo, issueNumber:$issueNum}')
          curl -s -o /dev/null -w "%{http_code}" --retry 3 -X POST \
            "${{ secrets.SELLIO_WORKER_URL }}/api/ai-pipeline/result" \
            -H "Content-Type: application/json" \
            -H "X-Sellio-Signature: ${{ secrets.SELLIO_WEBHOOK_SECRET }}" \
            -d "$PAYLOAD"

      # ── 12. Notify Cloudflare — FAILURE ───────────────────────────────
      - name: "Notify Cloudflare (failure)"
        if: failure()
        run: |
          if [ -z "${{ secrets.SELLIO_WORKER_URL }}" ]; then exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PAYLOAD=$(jq -n \
            --arg taskId "${{ inputs.task_id }}" \
            --arg branch "${{ inputs.branch_name }}" \
            --arg status "failed" \
            --arg owner  "${{ inputs.owner }}" \
            --arg repo   "${{ inputs.repo }}" \
            --argjson issueNum "${{ inputs.issue_number }}" \
            --arg error  "OpenCode failed. Logs: $RUN_URL" \
            '{taskId:$taskId, branch:$branch, status:$status, owner:$owner, repo:$repo, issueNumber:$issueNum, error:$error}')
          curl -s -o /dev/null -w "%{http_code}" --retry 3 -X POST \
            "${{ secrets.SELLIO_WORKER_URL }}/api/ai-pipeline/result" \
            -H "Content-Type: application/json" \
            -H "X-Sellio-Signature: ${{ secrets.SELLIO_WEBHOOK_SECRET }}" \
            -d "$PAYLOAD"
